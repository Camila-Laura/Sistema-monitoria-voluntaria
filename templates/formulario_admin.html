{% extends 'base.html' %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Cabecalho do site -->
    {% include 'nav_bar.html' %}

    <!-- formulario para adicionar um administrador no sistema -->
    <div class="container-fluid">
        <div class="row justify-content-center mt-5 pt-4">
            <section class="col-12 col-sm-6 col-md-4">
                <form action="" class="container-form p-4 rounded-4 mt-5 shadow" 
                  style="background-color: #f0f4ff; box-shadow: 0 4px 20px rgba(0, 0, 100, 0.12)">
                    <h2 class="text-center mb-4">Formulário Administrador</h2>
    
                    <div class="form-group mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome</label>
                        <input type="text" id="nome" class="form-control" autofocus, required>
                        <p id="erro-nome" style="color: red; display: none;">O nome precisa ter mais de 2 letras</p>
                        
                    </div>

                    <div class="form-group mb-3">
                        <label for="cargo" class="form-label fw-semibold">Cargo</label>
                        <input type="text" id="cargo" class="form-control">
                    </div>

                    <div class="form-group mb-4">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" id="email" class="form-control">
                        <p id="erro-nome" style="color: red; display: none;">E-mail Inválido!</p>
                    </div>

                    <div class="form-group mb-4">
                        <label for="senha" class="form-label fw-semibold">Senha</label>
                        <input type="password" id="senha" class="form-control">
                    </div>

                    <div class="form-group mb-4">
                        <label for="confirmar_senha" class="form-label fw-semibold">Confirmar Senha</label>
                        <input type="password" id="confirmar_senha" class="form-control">
                    </div>

                    <button onclick="criarAdmin()" class="btn btn-primary btn-block fw-bold w-100">Salvar</button>
                </form>
            </section>
        </div>
    </div>

<script src="{{ url_for('static', filename='JS/formulario_admin.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% endblock %}
