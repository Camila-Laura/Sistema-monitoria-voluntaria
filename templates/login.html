{% extends 'base.html' %}
{% block body_class %}com-navbar-fixo{% endblock %}
{% block content %}
<!-- formulario de login -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="{{url_for('static', filename='CSS/login.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

{% include 'nav_bar.html' %}
<div class="login">
    <div class="container-fluid">
        <div class="row justify-content-center pt-4">
            <section class="col-12 col-sm-6 col-md-4 pt-5 pb-5">
                <form action="" class="form-container">
                    <h2 class="text-center">Login</h2>

                    <div class="form-group mb-3">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="text" id="login" class="form-control">
                    </div>

                    <div class="form-group mb-3">
                        <label for="senha" class="form-label fw-semibold">Senha</label>
                        <input type="password" id="senha" class="form-control">
                    </div>

                    <button onclick="Login()" class="btn-button btn-block fw-bold w-100">Login</button><br>
                    
                    <!-- verificação para vê se já tem administrador cadastrado  no sistema. Caso não tenha vai exibir a opção de criar conta -->
                    {% if not admin_existente %}
                        <p class="paragrafo">Ainda não tem cadastro?</p>
                        <a href="{{ url_for('formulario_admin') }}" class="link-conta">Criar Conta Administrador</a>
                    {% endif %}
                </form>
            </section>
        </div>
    </div>   
</div>
<script src="{{ url_for('static', filename='JS/index.js') }}"></script>
{% endblock %}
